<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 办公效率产品店 · AI 职场模板与提示词包</title>
<meta name="description" content="AI 办公效率数字产品店：简历模板包、PPT 大纲模板包、Excel+AI 提示词包、周报日报提示词包等，职场提效数字商品。">
<style>
:root{--bg:#f3f4ff;--card:#ffffff;--ink:#1e1b4b;--mut:#64748b;--pri:#4f46e5;--pri2:#7c3aed;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 48px}
.site-nav{display:flex;align-items:center;gap:16px;margin:0 0 18px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.site-nav .nav-logo{font-weight:800;font-size:15px;color:var(--pri)}
.site-nav .nav-link{font-size:13px;color:var(--mut);text-decoration:none;font-weight:600}
.site-nav .nav-link:hover{color:var(--pri)}
.site-nav .nav-link.on{color:var(--pri)}
header{text-align:center;padding:18px 0 8px}
header h1{font-size:26px;font-weight:800;background:linear-gradient(120deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);margin-top:8px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 24px rgba(79,70,229,.07);margin-top:18px}
.card h2{font-size:18px;margin-bottom:10px}
.placeholder{color:var(--mut);font-size:13px;background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:20px;margin-top:14px}
ul.prods{list-style:none;margin-top:14px}
ul.prods li{padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fbfbfe}
ul.prods b{font-size:14px;color:var(--ink);display:block}
ul.prods .p{color:var(--pri);font-weight:800;font-size:14px}
ul.prods .d{color:var(--mut);font-size:12px;display:block;margin-top:3px}
ul.prods .buy{display:inline-block;margin-top:8px;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-radius:8px;padding:6px 16px;font-size:12px;font-weight:700;text-decoration:none}
.ad-slot{margin:22px 0 0;background:#fffbe6;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;text-align:center;font-size:12px;color:#92400e}
.ad-slot b{font-size:13px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
@media(max-width:640px){header h1{font-size:21px}.card{padding:18px 14px}.site-nav{gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="site-nav">
    <a class="nav-logo" href="../">⚡ 轻工具</a>
    <a class="nav-link" href="../">首页工具</a>
    <a class="nav-link" href="../kb/">知识库</a>
    <a class="nav-link on" href="./">产品店</a>
  </nav>
  <header>
    <h1>AI 办公效率产品店</h1>
    <p>职场提效数字商品：模板包 / 提示词包 / 工具清单，随用随下</p>
  </header>
  <div class="card">
    <h2>在售产品</h2>
    <div class="placeholder">本栏目由自动化任务每周日 22:30 上新：把小红书已产内容沉淀为简历模板包、PPT 大纲包、Excel+AI 提示词包等可售数字产品。上线后自动填充产品列表与购买链接。</div>
    <ul class="prods" id="prodList"></ul>
  </div>
  <div class="ad-slot"><b>广告位</b> · 本区域可投放办公效率类产品广告（自助广告位）</div>
  <footer>AI 办公效率产品店 · 虚拟数字商品 · 交易通过第三方平台完成</footer>
</div>
<script>
fetch('./products.json').then(function(r){return r.json()}).then(function(list){
  var el=document.getElementById('prodList');
  if(!list||!list.length)return;
  var html='';
  list.forEach(function(a){
    html+='<li><b>'+a.name+'</b><span class="p">'+a.price+'</span><span class="d">'+a.desc+'</span>';
    if(a.url)html+='<a class="buy" href="'+a.url+'" target="_blank" rel="noopener">前往购买</a>';
    html+='</li>';
  });
  el.innerHTML=html;
}).catch(function(){});
</script>
</body>
</html>
